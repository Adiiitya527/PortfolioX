# Gradle settings shared by everyone who builds the project.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# Market data source for the app: "sample" (built-in simulator, works offline)
# or "remote" (the FastAPI server in server/, see server/README.md).
portfoliox.marketDataSource=sample
# Where the remote server lives. With `adb reverse tcp:8000 tcp:8000`, the device's localhost:8000
# is tunnelled to your PC (works for emulators and USB phones, no firewall rules needed).
# Alternative for the emulator only: http://10.0.2.2:8000/ (the emulator's alias for your PC).
portfoliox.apiBaseUrl=http://localhost:8000/
